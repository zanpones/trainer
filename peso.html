<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Peso</title>

<style>

body{

background:#0f172a;
color:white;
font-family:Arial;
text-align:center;
padding:20px;

}

.card{

background:#1e293b;
padding:20px;
border-radius:12px;
margin-top:20px;

}

input{

width:100%;
padding:12px;
border-radius:8px;
border:none;
margin-top:10px;

}

button{

width:100%;
padding:12px;
margin-top:10px;
background:#3b82f6;
border:none;
border-radius:8px;
color:white;
font-size:16px;

}

.resultado{

margin-top:20px;
font-size:18px;

}

</style>

</head>

<body>

<h1>⚖️ Controle de Peso</h1>

<div class="card">

<label>Peso da semana (kg)</label>

<input type="number" id="peso">

<button onclick="salvarPeso()">Salvar Peso</button>

</div>

<div class="card">

<h2>📊 Resultado IA</h2>

<div id="resultado" class="resultado"></div>

</div>

<script>

function salvarPeso(){

let peso=document.getElementById("peso").value

localStorage.setItem("pesoAtual",peso)

analisarPeso()

}

function analisarPeso(){

let peso=localStorage.getItem("pesoAtual")

let msg=""

if(peso>95){

msg="⚠️ Peso alto. Sugestão: reduzir açúcar e aumentar cardio para 20 min."

}

else if(peso>85){

msg="👍 Peso intermediário. Continue treino + cardio 10 a 15 min."

}

else{

msg="🔥 Ótimo peso. Foco em manter dieta equilibrada."

}

document.getElementById("resultado").innerHTML=

"Peso atual: "+peso+" kg <br><br>"+msg

}

analisarPeso()

</script>

</body>

</html>
