<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meu Treino</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<h1>🏋️ Meu Treino</h1>

<div class="menu">

<a href="segunda.html"><button>SEGUNDA</button></a>
<a href="quarta.html"><button>QUARTA</button></a>
<a href="sexta.html"><button>SEXTA</button></a>

</div>

<div class="card">

<div class="cal-top">

<button onclick="mesAnterior()">⬅</button>

<h2 id="mes"></h2>

<button onclick="proximoMes()">➡</button>

</div>

<div class="dias-semana">

<div>SEG</div>
<div>TER</div>
<div>QUA</div>
<div>QUI</div>
<div>SEX</div>
<div>SAB</div>
<div>DOM</div>

</div>

<div id="calendario"></div>

</div>

<div class="obs">

<h2>📌 Observação</h2>

<p>Terça-feira → Descanso ou Cardio</p>
<p>Quinta-feira → Cardio + Abdômen</p>

</div>

<script>

let data = new Date()

function gerarCalendario(){

let ano = data.getFullYear()
let mes = data.getMonth()

let meses = [
"Janeiro","Fevereiro","Março","Abril",
"Maio","Junho","Julho","Agosto",
"Setembro","Outubro","Novembro","Dezembro"
]

document.getElementById("mes").innerText =
meses[mes]+" "+ano

let primeiroDia = new Date(ano,mes,1).getDay()
primeiroDia = (primeiroDia + 6) % 7

let ultimoDia = new Date(ano,mes+1,0).getDate()

let calendario = document.getElementById("calendario")

calendario.innerHTML=""

for(let i=0;i<primeiroDia;i++){

let vazio=document.createElement("div")
calendario.appendChild(vazio)

}

for(let dia=1;dia<=ultimoDia;dia++){

let btn=document.createElement("button")

btn.innerText=dia

let chave="treino-"+ano+"-"+mes+"-"+dia

if(localStorage.getItem(chave)){

btn.classList.add("treinado")

}

btn.onclick=function(){

if(localStorage.getItem(chave)){

localStorage.removeItem(chave)
btn.classList.remove("treinado")

}else{

localStorage.setItem(chave,"ok")
btn.classList.add("treinado")

}

}

calendario.appendChild(btn)

}

}

function proximoMes(){

data.setMonth(data.getMonth()+1)

gerarCalendario()

}

function mesAnterior(){

data.setMonth(data.getMonth()-1)

gerarCalendario()

}

gerarCalendario()

</script>

</body>
</html>
