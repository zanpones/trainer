<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Controle de Peso</title>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
text-align:center;
padding:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:12px;
margin-top:20px;
box-shadow:0 5px 20px rgba(0,0,0,0.5);
}

input{
width:100%;
padding:12px;
border-radius:8px;
border:none;
margin-top:10px;
}

button{
width:100%;
padding:12px;
margin-top:15px;
background:#3b82f6;
border:none;
border-radius:8px;
color:white;
font-size:16px;
cursor:pointer;
}

.resultado{
margin-top:20px;
font-size:18px;
line-height:1.6;
}

</style>

</head>

<body>

<h1>⚖️ IA Controle de Peso</h1>

<div class="card">

<label>Altura (ex: 1.75)</label>
<input type="number" step="0.01" id="altura">

<label>Peso atual (kg)</label>
<input type="number" id="peso">

<button onclick="calcular()">Analisar</button>

</div>

<div class="card">

<h2>📊 Resultado</h2>

<div id="resultado" class="resultado"></div>

</div>

<script>

function calcular(){

let altura = parseFloat(document.getElementById("altura").value)
let peso = parseFloat(document.getElementById("peso").value)

let imc = peso / (altura * altura)

let msg=""

if(imc < 18.5){
msg="Peso abaixo do ideal. Foque em ganhar massa."
}
else if(imc < 25){
msg="Peso ideal. Continue com treino e alimentação equilibrada."
}
else if(imc < 30){
msg="Leve sobrepeso. Sugestão: cardio 15 min + reduzir açúcar."
}
else{
msg="Sobrepeso alto. Sugestão: cardio 20-30 min + dieta controlada."
}

let pesoIdealMin = 18.5 * (altura*altura)
let pesoIdealMax = 24.9 * (altura*altura)

document.getElementById("resultado").innerHTML=

"IMC: "+imc.toFixed(2)+"<br><br>"+
"Peso ideal entre:<br>"+
pesoIdealMin.toFixed(1)+" kg e "+pesoIdealMax.toFixed(1)+" kg<br><br>"+
msg

}

</script>

<a href="menu.html"><button class="voltar">⬅ Voltar</button></a> 
  
</body>
</html>
